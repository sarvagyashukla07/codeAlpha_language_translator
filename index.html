
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaAI | Language Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="header">
            <div class="logo">L<span>AI</span></div>
            <div>
                <h1>LinguaAI</h1>
                <p>Break language barriers.</p>
            </div>
        </header>

        <div class="badge">✦ Smart Language Translator</div>

        <div class="language-bar">
            <div class="language-select">
                <label for="sourceLanguage">Translate from</label>
                <select id="sourceLanguage">
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 Hindi</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="de">🇩🇪 German</option>
                </select>
            </div>

            <button id="swapBtn" class="swap-btn" type="button"
                title="Swap languages" aria-label="Swap languages">⇄</button>

            <div class="language-select">
                <label for="targetLanguage">Translate to</label>
                <select id="targetLanguage">
                    <option value="hi">🇮🇳 Hindi</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="de">🇩🇪 German</option>
                </select>
            </div>
        </div>

        <div class="translator">
            <section class="text-panel">
                <div class="panel-heading">
                    <span>Your text</span>
                    <button id="clearBtn" class="text-btn" type="button">Clear</button>
                </div>

                <textarea id="inputText" maxlength="500"
                    placeholder="Type or paste your text here..."></textarea>

                <div class="panel-footer">
                    <span id="charCount">0 / 500</span>
                    <span>Input</span>
                </div>
            </section>

            <section class="text-panel output-panel">
                <div class="panel-heading">
                    <span>Translation</span>
                    <span class="live-dot">● Ready</span>
                </div>

                <textarea id="outputText" placeholder="Your translation will appear here..."
                    readonly></textarea>

                <div class="panel-footer">
                    <span id="outputCount">0 characters</span>
                    <button id="copyBtn" class="text-btn" type="button">Copy ↗</button>
                </div>
            </section>
        </div>

        <button id="translateBtn" class="translate-btn" type="button">
            <span>✦</span> Translate Now <span>→</span>
        </button>

        <div id="status" class="status" role="status" aria-live="polite">
            Choose your languages and enter text to get started.
        </div>

        <footer>
            <span>LINGUAAI</span>
            <span>Powered by MyMemory API</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
